<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Sin conexión</title>
<style>
:root{color-scheme:light dark;--fondo:#faf9f6;--texto:#1d1c1a;--suave:#6b6862;--color:#2F6B4F}
@media (prefers-color-scheme:dark){:root{--fondo:#141713;--texto:#f1f4ef;--suave:#a8aea6}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--fondo);color:var(--texto);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;text-align:center}
main{max-width:340px}
img{width:72px;height:72px;border-radius:18px;display:block;margin:0 auto 20px}
h1{margin:0 0 8px;font-size:1.25rem;font-weight:700}
p{margin:0 0 22px;color:var(--suave)}
button{font:inherit;font-weight:600;min-height:44px;padding:10px 22px;border-radius:12px;border:0;background:var(--color);color:#fff;cursor:pointer}
button:focus-visible{outline:2px solid var(--color);outline-offset:3px}
</style>
</head>
<body>
<main>
<img src="icon-192.png" alt="">
<h1 id="t">Sin conexión</h1>
<p id="d">No pudimos conectarnos. Revisá tu internet y volvé a intentarlo.</p>
<button type="button" id="reintentar">Reintentar</button>
</main>
<script>
(function () {
  var L = { en: ['No connection', 'We could not connect. Check your internet and try again.', 'Try again'], pt: ['Sem conexão', 'Não conseguimos conectar. Verifique sua internet e tente de novo.', 'Tentar de novo'] };
  var c = L[String(navigator.language || 'es').slice(0, 2).toLowerCase()];
  if (c) { document.documentElement.lang = String(navigator.language).slice(0, 2); document.title = c[0]; document.getElementById('t').textContent = c[0]; document.getElementById('d').textContent = c[1]; document.getElementById('reintentar').textContent = c[2]; }
  document.getElementById('reintentar').addEventListener('click', function () { location.reload(); });
})();
</script>
</body>
</html>
